<title>Doorway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --navy:#0E1823; --cream:#F3ECE0; --card:#FBF7F0;
  --amber:#D9A24A; --amb2:#8F5A0E; --ink:#1A2433; --mut:#5A6472; --line:#DDD2BF;
  --red:#C8553D; --redbg:#F3D9D3; --redink:#9B3A2A; --ok:#2F6246;
  --disp:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--cream);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.ui > *{pointer-events:auto}
.topbar{display:flex;align-items:center;gap:10px;height:48px;flex-shrink:0;font-size:12px;
  letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#CBD6E2;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.topbar .dots{margin-left:auto;display:flex;gap:5px}
.backb{background:none;border:0;color:#9FB0C4;font:700 11px/1 var(--sans);letter-spacing:1.6px;text-transform:uppercase;padding:9px 12px 9px 0;cursor:pointer}
.restb{background:none;border:0;color:#7D8EA2;font:700 11px/1 var(--sans);letter-spacing:1.4px;text-transform:uppercase;padding:9px 0 9px 12px;cursor:pointer}
.restb.solo{margin-left:auto}
.modal{position:fixed;inset:0;z-index:60;background:rgba(7,12,19,.74);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .card{background:var(--cream);color:var(--ink);border-radius:22px;padding:22px 20px 18px;width:100%;max-width:430px}
.modal h3{font:700 19px/1.25 var(--serif);margin:0 0 7px}
.modal p{font:400 14px/1.5 var(--sans);color:#4A5663;margin:0 0 16px}
.topbar i{width:7px;height:7px;border-radius:50%;background:#56687C;display:block;transition:background .3s}
.topbar i.on{background:var(--amber)}
.veil{position:fixed;inset:0;background:#070C12;z-index:3;opacity:0;pointer-events:none;transition:opacity .42s}
.crawl{position:fixed;inset:0;z-index:4;background:#070C12;display:flex;align-items:center;justify-content:center;
  padding:0 34px;opacity:0;pointer-events:none;transition:opacity .55s;overflow:hidden}
.crawl.on{opacity:1;pointer-events:auto}
.drift{position:absolute;inset:-30%;opacity:.55;
  background-image:
   radial-gradient(1.7px 1.7px at 18% 14%,rgba(236,224,200,.55),transparent 60%),
   radial-gradient(1.2px 1.2px at 71% 9%,rgba(236,224,200,.38),transparent 60%),
   radial-gradient(1.5px 1.5px at 42% 33%,rgba(217,162,74,.42),transparent 60%),
   radial-gradient(1.1px 1.1px at 88% 41%,rgba(236,224,200,.34),transparent 60%),
   radial-gradient(1.6px 1.6px at 9% 57%,rgba(236,224,200,.44),transparent 60%),
   radial-gradient(1.2px 1.2px at 59% 68%,rgba(217,162,74,.34),transparent 60%),
   radial-gradient(1.4px 1.4px at 31% 82%,rgba(236,224,200,.40),transparent 60%),
   radial-gradient(1.1px 1.1px at 79% 91%,rgba(236,224,200,.30),transparent 60%);
  background-size:300px 300px;animation:drift 64s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:0 -600px}}
.crawl p{position:relative;max-width:460px;text-align:center;margin:0;opacity:0;transition:opacity .34s}
.crawl-dots{position:absolute;left:0;right:0;bottom:78px;display:flex;gap:7px;justify-content:center}
.crawl-dots i{width:6px;height:6px;border-radius:50%;background:#2E3B4E;display:block;transition:background .3s}
.crawl-dots i.on{background:var(--amber)}
.crawl-hint{position:absolute;left:0;right:0;bottom:48px;text-align:center;font:500 12px var(--sans);
  color:#5D6E85;transition:opacity .4s}
.crawl-skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:none;border:0;
  color:#64758B;font:700 11px/1 var(--sans);letter-spacing:2px;text-transform:uppercase;padding:12px;cursor:pointer}
.crawl b{display:block;font-family:var(--disp);font-size:clamp(25px,7.2vw,33px);line-height:1.13;
  font-weight:600;color:var(--cream);margin:0 0 11px}
.crawl span{display:block;font-size:15.5px;line-height:1.52;color:#9FB0C4}
@media (prefers-reduced-motion:reduce){.drift{animation:none}}
.veil.on{opacity:1}
.spacer{flex:1;min-height:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:8px;padding-top:6px}
.hint{background:rgba(217,162,74,.94);color:#2A1E0C;font:700 12.5px/1 var(--sans);padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:opacity .45s}
.live{font:700 12px/1.4 var(--sans);color:#EBDCC2;background:rgba(10,18,27,.82);padding:9px 15px;border-radius:14px;max-width:320px;text-align:center}
.hero{padding:40px 10px calc(30px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin:0 auto;
  background:linear-gradient(to top,var(--navy) 42%,rgba(14,24,35,.90) 72%,rgba(14,24,35,0))}
.h1{font-family:var(--disp);font-size:clamp(31px,8.6vw,39px);line-height:1.07;font-weight:600;margin:0 0 12px;color:var(--cream)}
.lede{font-size:15px;line-height:1.5;color:#B8C5D2;margin:0 0 20px}
.kick{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--amber);font-weight:700;margin:0 0 10px}
.sheet{background:var(--cream);color:var(--ink);border-radius:26px 26px 0 0;margin:0 -16px;
  padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:68vh;overflow-y:auto;
  box-shadow:0 -14px 40px rgba(0,0,0,.45)}
.sheet.plain{border-radius:0;max-height:none;flex:1;display:flex;flex-direction:column;gap:13px;padding-top:30px}
.eyeb{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--amb2);font-weight:700;margin:0 0 8px}
.q{font-family:var(--disp);font-size:27px;line-height:1.15;font-weight:600;margin:0 0 5px;color:var(--ink);text-wrap:balance}
.scene-note{font-size:13px;line-height:1.4;color:var(--mut);margin:0 0 10px;font-style:italic}
.why-t{background:none;border:0;padding:0 0 8px;font:700 12.5px/1 var(--sans);color:var(--amb2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;display:block}
.why{font-size:13px;line-height:1.46;color:var(--ink);margin:0 0 10px;padding-left:11px;border-left:2.5px solid var(--amber);text-align:left}
.clin{font-size:11.5px;color:#8a8275;margin:0 0 13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;
  font-size:15px;line-height:1.34;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;
  font-family:inherit;width:100%;transition:background .15s,border-color .15s}
.opt .bx{width:18px;height:18px;border-radius:5px;border:1.6px solid #C9BCA4;flex-shrink:0;margin-top:1px;position:relative}
.opt[aria-pressed="true"]{border-color:var(--amber);background:#F6E7C9}
.opt[aria-pressed="true"] .bx{background:var(--amber);border-color:var(--amber)}
.opt[aria-pressed="true"] .bx::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;
  border:solid #3A2A0A;border-width:0 2px 2px 0;transform:rotate(42deg)}
.opt.ns{border-style:dashed}
.btn{display:block;width:100%;background:var(--navy);color:var(--cream);border:0;border-radius:30px;padding:16px;
  font:700 15px/1.2 var(--sans);cursor:pointer;margin-top:14px}
.btn.amb{background:var(--amber);color:#2A1E0C}
.btn.red{background:var(--red);color:#fff}
.btn[disabled]{opacity:.42;cursor:default}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.ghost{display:block;width:100%;background:none;border:0;color:var(--mut);font:500 13.5px var(--sans);padding:12px;cursor:pointer;text-align:center}
.pill{display:inline-block;border-radius:999px;padding:6px 14px;font:700 11px/1.2 var(--sans);letter-spacing:2px;
  text-transform:uppercase;background:#F6E7C9;color:var(--amb2);margin-bottom:4px}
.pill.red{background:var(--redbg);color:var(--redink)}
.p{font-size:15px;line-height:1.52;color:var(--mut);margin:0}
.p.b{color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}
.box .k{font:700 10.5px/1.2 var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--amb2);margin-bottom:8px}
.box .l{font-size:13.5px;line-height:1.55;color:var(--ink)}
.box .l b{display:inline-block;min-width:17px}
.row{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.row .n{width:27px;height:27px;border-radius:50%;background:var(--navy);color:var(--cream);font:700 12px/27px var(--sans);text-align:center;flex-shrink:0}
.row .n.g{background:var(--ok)} .row .n.a{background:var(--amb2)}
.row .t{font-size:14.5px;line-height:1.4;color:var(--ink)}
.row .t s{display:block;text-decoration:none;font-size:12.5px;color:var(--mut);margin-top:2px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.note{font-size:12px;color:#8a8275;margin:10px 0 0;text-align:center}
</style>

  f:[-0.80,14.70,0.15,2.3],act:'archive',

 /* ---------- 2 · PRODUCTION FLOOR (testes) ---------- */
 {s:1,q:'Have you noticed a lump, swelling, or new pain in either testicle?',

 {s:1,q:'Has either testicle ever been injured, twisted, operated on, or swollen with mumps?',
  note:'Mumps only affects fertility if it came after puberty and made the testicles swell.',

  f:[-0.55,6.18,0.04,2.2],act:'scorch',
  o:[['Mumps after about age 12, with swollen testicles','mumps'],['A significant injury to the testicles','surg'],
     ['A twisted testicle','surg'],['Surgery on a testicle','surg'],['None of these','-'],['Not sure','-',1]]},
 {s:1,q:'Have you ever had chemotherapy, radiotherapy to the pelvis, or a genetic diagnosis?',
  sn:'A whole bay sits behind plastic sheeting.',
  f:[-0.09,7.72,-0.50,2.2],act:'cordon',
  o:[['Chemotherapy','chemo'],['Radiotherapy to the pelvis or abdomen','chemo'],
     ['A genetic condition I’ve been told about','genetic'],['None of these','-'],['Not sure','-',1]]},
 {s:1,q:'Are your testicles regularly exposed to heat?',
  note:'Sperm are made a few degrees below body temperature. That is why the testicles hang outside the body.',
  sn:'A worker is up at the wall gauge, watching the needle.',
  f:[0.52,8.45,-1.50,2.3],act:'thermo',

     ['Hot work — long-haul driving, welding, kitchens','heat'],
     ['A fever or illness in the last 3 months','fever'],['None of these','-']]},
 {s:2,q:'Do you have difficulty getting an erection, keeping one, or ejaculating?',
  note:'Common, treatable, and it changes what a test result means — so it is worth saying.',
  sn:'The inlet valve is jammed half way.',
  f:[-0.30,1.08,1.00,2.2],act:'shutter',
  o:[['Difficulty getting an erection','sexual'],['Difficulty keeping one','sexual'],

     ['None of these','-'],['Prefer not to say','-',1]]},
 {s:2,q:'Have you ever had a sexually transmitted infection, a swollen epididymis, or repeated urine infections?',
  note:'Scarring can block the tube long afterwards. No judgement here.',
  sn:'The glass run has silted up.',
  f:[3.00,1.06,0.50,2.5],act:'flood',
  o:[['A sexually transmitted infection','sti'],['A painful, swollen epididymis','sti'],

 {s:2,q:'Have you had any of these operations?',
  note:'Sperm travel up a tube about as thick as a pencil lead. Some operations block it or cut it.',

 {s:2,q:'Do any of these apply to you?',

/* asked after the result, where they are actually actionable */
const LIFEQ=[['I smoke or vape','smoking'],['I drink alcohol regularly','alcohol'],
 ['I use cannabis','cannabis'],['I\u2019m carrying extra weight','weight'],
 ['I work with chemicals, pesticides or solvents','toxins'],
 ['We have sex about once a week, or less','infrequent'],

const SEC=[
 {n:'Head Office',kick:'Section one of three',
  t:'The board decides what gets made.',
  d:'Up here they meet, they agree a number, and they send the order down. Nothing is produced below until this room says so.',
  cam:[0,15.0,0,3.4]},
 {n:'Production Floor',kick:'Section two of three',
  t:'The order has arrived. The line starts.',
  d:'This is where the product is actually made — about seventy-four days from raw material to finished unit. Everything you change up here shows up three months later.',
  cam:[0,7.6,0,3.8]},
 {n:'The Road Out',kick:'Section three of three',
  t:'Finished units leave by pipe.',
  d:'Loaded, pushed out, delivered. A perfect plant still fails if the way out is shut.',
  cam:[0.5,1.35,-0.1,3.5]}
];
const ZONE=[{n:'Head Office'},{n:'Production Floor'},{n:'The Road Out'}];

function triage(f){
  const h=k=>!!f[k];
  if(h('lump')||h('acutePain'))
    return{k:'urgent',rule:'R-01',title:'Please see a doctor today.',
      why:'You’ve told us about a lump or sudden pain in a testicle. That needs looking at now — not after a fertility test, and not next week.',
      extra:'It is very often nothing serious. But it is the one thing that should never wait, so we’ve stopped here on purpose.'};
  const early=[];
  if(h('udt2')||h('chemo')||h('vasectomy')||h('genetic')) early.push('a known cause in your history');
  if(h('pituitary')) early.push('something that can affect the signal from the brain');
  if(h('hypogonadism')||h('testosterone')) early.push('signs that your hormones need checking');
  if(f.partnerAge>=36 && f.months>=12) early.push('your partner’s age with the time you’ve been trying');
  if(early.length)
    return{k:'soon',rule:'R-04/05/06',title:'Don’t wait. See a doctor soon.',
      why:'Because of '+early.join(', and ')+', waiting the usual twelve months isn’t the right plan for you. Ask for a semen analysis at the same visit.'};
  if(f.months>=12)
    return{k:'now',rule:'R-10',title:'Now is the right time to get tested.',
      why:'You’ve been trying twelve months or more. Nobody — not you, not a doctor — can know what’s leaving the loading bay without counting it once.'};
  if(f.partnerAge>=36 && f.months>=6)
    return{k:'soon',rule:'NICE',title:'Don’t wait the full year.',
      why:'With your partner aged 36 or over, the usual advice is to start looking after about six months rather than twelve. See a doctor and ask for a semen analysis.'};
  if(h('sexual')||h('obstruct')||h('sti')||h('udt1')||h('mumps')||h('surg')||h('varicocele')||h('retro')||h('meds'))
    return{k:'gp',rule:'R-11/12',title:'Worth a conversation with a doctor.',
      why:'Nothing here needs acting on today, but you’ve mentioned something a doctor should know about — and they can examine you in a couple of minutes.'};
  return{k:'plan',rule:'R-13',title:'Nothing here needs acting on yet.',
    why:'That isn’t the same as “you’re fine” — a man with a problem usually feels completely well. It means nothing you’ve told us needs a doctor today.',
    extra:'The test is available whenever you want to know. Here’s what’s worth doing either way.'};
}
const LIFE={smoking:'Stop smoking — it lowers both count and movement.',weight:'Work towards a healthy weight.',
  heat:'Cut the heat: no hot tubs, no laptop on your lap.',alcohol:'Keep alcohol down.',cannabis:'Stop cannabis.',
  toxins:'Use protection around chemicals at work.',
  testosterone:'Stop testosterone or steroids — under a doctor, never suddenly on your own. It is the single biggest thing on this list.',
  supplements:'Stop unproven supplements. None are shown to work.',
  lube:'Swap to a fertility-friendly lubricant — most kill sperm.',
  infrequent:'Aim for sex every 2 to 3 days across the month.'};
const LBL={testosterone:'exogenous testosterone / AAS',supplements:'unproven supplements',
  hypogonadism:'symptoms of hypogonadism',pituitary:'possible central cause',varicocele:'scrotal ache (?varicocele)',
  udt1:'unilateral cryptorchidism',udt2:'bilateral cryptorchidism',surg:'testicular trauma or surgery',
  mumps:'mumps orchitis',chemo:'gonadotoxic treatment',genetic:'known genetic diagnosis',heat:'scrotal heat exposure',
  fever:'febrile illness within 3 months',smoking:'smoking',alcohol:'alcohol',cannabis:'cannabis',weight:'raised BMI',
  toxins:'occupational exposure',vasectomy:'vasectomy',obstruct:'possible surgical obstruction',
  sti:'prior genital infection',sexual:'erectile or ejaculatory dysfunction',retro:'features of retrograde ejaculation',
  meds:'gonadotoxic medication',infrequent:'low coital frequency',lube:'spermicidal lubricant',
  lump:'TESTICULAR LUMP',acutePain:'ACUTE TESTICULAR PAIN'};

/* ============================= 3D ============================= */
/* Three robotic organs on one spine. The shapes are the real organs;
   only the material is machine. Head office is the cranial shell with the
   pituitary slung under it; the production floor is a testis, its coiled
   seminiferous tubule run round the inside wall; the outlet is the
   prostate manifold, the vesicle tanks and the urethra out to the gate. */
let SC=null;
async function boot3D(){
  const THREE=await import('three');
  const {RoundedBoxGeometry}=await import('three/examples/jsm/geometries/RoundedBoxGeometry.js');

/* The crawl moves when he moves it. A tap is "next", never "skip" \u2014

   button, in the corner, where it has to be meant.                      */
function screenEnter(){
  const cr=document.getElementById('crawl'), ct=document.getElementById('crawlText');
  const dots=document.getElementById('crawlDots'), hint=document.getElementById('crawlHint');
  const skip=document.getElementById('crawlSkip'), stage=document.getElementById('stage');
  let step=0, open=false, ended=false;
  dots.innerHTML='';CRAWL.forEach(()=>dots.appendChild(document.createElement('i')));
  const paint=()=>{
    ct.style.opacity='0';
    setTimeout(()=>{const b=CRAWL[step];
      ct.innerHTML='<b>'+b[0]+'</b><span>'+b[1]+'</span>';ct.style.opacity='1';},300);
    [...dots.children].forEach((d,k)=>{d.className=k<=step?'on':'';});
    hint.style.opacity=step===0?'1':'0';
  };
  const reveal=()=>{if(open)return;open=true;cr.classList.add('on');paint();};
  const finish=()=>{
    if(ended)return;ended=true;
    cr.classList.remove('on');ct.style.opacity='0';
    cr.onclick=null;skip.onclick=null;stage.onclick=null;
    if(SC)SC.toTower();
    setTimeout(()=>{
      const h=el('div','hero fade');
      h.appendChild(el('h1','h1','This is yours.'));
      h.appendChild(el('p','lede','It has never once been inspected.'));
      const b=el('button','btn amb','Begin the inspection');b.onclick=()=>screenSection(0);
      h.appendChild(b);
      wrap([el('div','topbar'),el('div','spacer'),h]);
    },280);
  };
  const next=()=>{
    if(ended)return;
    if(!open){reveal();return;}
    if(step<CRAWL.length-1){step++;paint();} else finish();
  };
  wrap([el('div','topbar')]);
  SC&&SC.roomPush();
  /* the camera move is the only thing on a timer, and a tap cuts it short */
  setTimeout(reveal,1100);

  skip.onclick=(e)=>{e.stopPropagation();finish();};
}

  s.appendChild(m);
  const b=el('button','btn amb',st.b);
  b.onclick=()=>{if(A.arr.stage<3){A.arr.stage++;screenAgent();}else screenLab();};
  s.appendChild(b);
  s.appendChild(el('p','note','Prototype: these steps advance on a tap. In use they arrive as notifications.'));
  wrap([bar('Doorway'),s]);
}

/* ---- the result, and a simple reading of it ---- */
/* Reference values: WHO laboratory manual, 6th edition (2021), 5th centiles. */
const WHO={vol:1.4,conc:16,total:39,prog:30,motile:42,morph:4};
const SAMPLES={
  normal:{vol:3.2,conc:48,total:154,prog:44,motile:58,morph:6},
  low:   {vol:2.4,conc:9, total:22, prog:22,motile:31,morph:3},
  none:  {vol:1.9,conc:0, total:0,  prog:0, motile:0, morph:0}
};
function interpret(id,r){
  if(id==='none')return{
    pill:'Needs a specialist',
    t:'No sperm were found in this sample.',
    p:'That reads as final. It is not. \u201cNone found\u201d has to be confirmed on a second sample, spun down and looked at again, before anyone calls it azoospermia \u2014 and a real share of men with none in the fluid are still making sperm that can be retrieved.',
    next:'A second sample, and a specialist appointment. Not a repeat in three months \u2014 now.',
    refer:'Urology or andrology, with hormone tests (FSH, LH, testosterone) and an examination.'};
  if(id==='low')return{
    pill:'Repeat, and see a doctor',
    t:'Three of the measures are below the reference range.',
    p:'Concentration, movement and shape are all low. On its own that explains less than it seems to: sperm take about 74 days to make and a single sample swings a great deal, so one low result is a reason to test again, not a conclusion.',
    next:'Repeat in about three months, and keep any changes you have made going in the meantime.',
    refer:'Take this to a doctor now rather than waiting for the repeat \u2014 sooner if your partner is 36 or over.'};
  return{
    pill:'Within range',
    t:'Everything measured is within the usual range.',
    p:'That is genuinely good news, and it is not the end of the story. A normal semen analysis does not rule out a male factor, and it says nothing at all about your partner.',
    next:'If you have been trying twelve months or more, you should both be seen \u2014 together.',
    refer:'Primary care, as a couple.'};
}
function screenLab(){
  SC&&SC.wide();
  const id=A.arr.sample,r=SAMPLES[id],v=interpret(id,r);
  const s=el('div','sheet plain fade');
  s.appendChild(el('span','pill'+(id==='none'?' red':''),v.pill));
  const h=el('h1','h1',v.t);h.style.color='var(--ink)';s.appendChild(h);
  s.appendChild(el('p','p b',v.p));
  const ROWS=[['Volume',r.vol.toFixed(1),'mL',WHO.vol,r.vol<WHO.vol],
              ['Concentration',r.conc,'million/mL',WHO.conc,r.conc<WHO.conc],
              ['Total count',r.total,'million',WHO.total,r.total<WHO.total],
              ['Moving forward',r.prog,'%',WHO.prog,r.prog<WHO.prog],
              ['Normal shape',r.morph,'%',WHO.morph,r.morph<WHO.morph]];
  const tb=el('div','box');
  tb.innerHTML='<div class="k">Your sample \u00b7 code '+CODE+'</div><div class="l">'+
    ROWS.map(([n,val,u,lim,bad])=>'<span style="display:inline-block;min-width:118px">'+n+'</span>'+
      '<b style="color:'+(bad?'var(--redink)':'var(--ok)')+'">'+val+' '+u+'</b>'+
      '<span style="color:#9a9284"> &nbsp;usual: '+lim+'+</span>').join('<br>')+'</div>';
  s.appendChild(tb);
  const cav=el('div','box');
  cav.innerHTML='<div class="k">What these numbers are not</div><div class="l">'+
    'They are reference values taken from men whose partners conceived within a year. '+
    'Below them does not mean you cannot father a child. Above them does not mean you will. '+
    'They are the start of a conversation with a doctor, not a verdict on you.</div>';
  s.appendChild(cav);
  const nx=el('div','box');
  nx.innerHTML='<div class="k">What to do next</div><div class="l">'+v.next+'</div>';
  s.appendChild(nx);
  const rf=el('div','box');
  rf.innerHTML='<div class="k">Who to see</div><div class="l">'+v.refer+'</div>';
  s.appendChild(rf);
  const both=el('div','box');
  both.innerHTML='<div class="k">This is half the picture</div><div class="l">'+
   'A semen analysis looks at one of two people. Whatever it says, if you have been trying for '+
   'twelve months \u2014 or six, if your partner is 36 or over \u2014 she needs to be seen as well. '+
   'Her assessment is often the more time-critical one, and this result does not stand in for it.</div>';
  s.appendChild(both);
  const sum=el('div','box');
  sum.innerHTML='<div class="k">Summary for your doctor</div><div class="l">'+
    'Semen analysis, code '+CODE+'. Volume '+r.vol.toFixed(1)+' mL, concentration '+r.conc+' M/mL, '+
    'total '+r.total+' M, progressive motility '+r.prog+'%, normal forms '+r.morph+'%. '+
    'Collected at home, at the lab within 60 minutes, not chilled. '+
    'Compared with WHO 6th edition lower reference limits. One sample \u2014 not a diagnosis.</div>';
  s.appendChild(sum);
  if(id!=='normal'){
    const sup=el('div','box');sup.style.borderColor='var(--amber)';
    sup.innerHTML='<div class="k">That is a lot to read on your own</div><div class="l">'+
     'Men are rarely offered anyone to talk to about this, and the ones who need it most are the least '+
     'likely to ask. Whatever you are feeling reading that \u2014 it is not an overreaction.</div>';
    const tb=el('button','btn red','Talk to someone now');
    const det=el('div','box');det.style.display='none';
    det.innerHTML='<div class="k">What that is</div><div class="l">'+
     'A trained counsellor who deals with this every day, in Arabic or English, at any hour. '+
     'You do not give a name. Nothing you say is attached to your result or your record, '+
     'and nobody is told you called.</div>';
    tb.onclick=()=>{det.style.display=det.style.display==='none'?'block':'none';};
    sup.appendChild(tb);sup.appendChild(det);s.appendChild(sup);}
  s.appendChild(el('button','btn amb','Send this to my doctor'));
  const row=el('div');row.style.cssText='display:flex;gap:6px;margin-top:10px';
  [['Within range','normal'],['Low','low'],['None found','none']].forEach(([t,k])=>{
    const g=el('button','ghost',t);g.style.cssText='flex:1;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:10px';
    if(k===id)g.style.background='#F6E7C9';
    g.onclick=()=>{A.arr.sample=k;screenLab();};row.appendChild(g);});
  s.appendChild(row);
  s.appendChild(el('p','note','Prototype: tap to see each of the three outcomes.'));
  wrap([bar('Doorway'),s]);
}

window.__scr={q:screenQ,section:screenSection,handoff:screenHandoff};window.__A=A;window.__nav={ask:()=>screenAsk(screenIntro),delivery:screenDelivery,pickup:screenPickup,intro:screenIntro,enter:screenEnter,ctx:()=>screenCtx(0),result:screenResult,arrange:screenArrange,method:screenMethod,board:screenBoard,agent:()=>{A.arr.stage=0;screenAgent();},lab:screenLab};
screenIntro();
boot3D().then(s=>{SC=s;window.__SC=s;window.__Q=Q;}).catch(e=>{console.error('3D unavailable',e);});
</script>
